<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayOnline - Tableau de bord Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        :root {
            --ink: #14122B;
            --ink-soft: #6E6A8C;
            --surface: #FFFFFF;
            --canvas: #F3F1FA;
            --accent: #C6FF3D;
            --accent-deep: #9FE000;
            --violet: #6C4CFF;
            --violet-deep: #4B2FDB;
            --danger: #FF4468;
            --danger-deep: #E12F52;
            --success: #16C784;
            --line: #E3E0F2;
        }

        body {
            min-height: 100vh;
            background: var(--canvas);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 0%, rgba(108,76,255,0.10) 0, transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(198,255,61,0.08) 0, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- top bar ---------- */
        .topbar {
            background: var(--ink);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
        }

        .wordmark .bolt {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 0.95rem;
        }

        .admin-badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.85);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .logout-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(255,68,104,0.25); border-color: var(--danger); }

        /* ---------- layout ---------- */
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 18px 60px;
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: var(--surface);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px -8px rgba(20,18,43,0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .tab-btn.active { background: var(--ink); color: white; }

        .panel { display: none; }
        .panel.active { display: block; }

        .card {
            background: var(--surface);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 20px -8px rgba(20,18,43,0.08);
            margin-bottom: 18px;
        }

        h2 {
            color: var(--ink);
            font-family: 'Sora', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .subtitle { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 18px; }

        .search-row { display: flex; gap: 10px; margin-bottom: 8px; }

        input, select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-size: 0.94rem;
            background: var(--canvas);
            color: var(--ink);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--violet);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(108,76,255,0.12);
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--ink-soft);
        }

        .btn {
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .btn-primary { background: var(--accent); color: var(--ink); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-deep); }

        .btn-violet { background: var(--violet); color: white; }
        .btn-violet:hover:not(:disabled) { background: var(--violet-deep); }

        .btn-danger { background: rgba(255,68,104,0.1); color: var(--danger); border: 1px solid rgba(255,68,104,0.3); }
        .btn-danger:hover:not(:disabled) { background: var(--danger); color: white; }

        .btn-success { background: rgba(22,199,132,0.12); color: var(--success); border: 1px solid rgba(22,199,132,0.3); }
        .btn-success:hover:not(:disabled) { background: var(--success); color: white; }

        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row .btn { flex: 1; min-width: 130px; }

        /* ---------- user result card ---------- */
        .user-card {
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin-top: 14px;
        }
        .user-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.02rem; color: var(--ink); }
        .user-id { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-soft); word-break: break-all; }

        .role-pill {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .role-admin { background: rgba(108,76,255,0.14); color: var(--violet); }
        .role-user { background: rgba(110,106,140,0.12); color: var(--ink-soft); }

        .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .stat-box {
            flex: 1;
            background: var(--canvas);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .stat-box .label { font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
        .stat-box .value { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--ink); }

        hr.sep { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

        .mini-label { font-weight: 700; font-size: 0.78rem; color: var(--ink); margin-bottom: 8px; }

        /* ---------- retraits ---------- */
        .retrait-row {
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 12px;
        }
        .retrait-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .retrait-montant { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--ink); }
        .retrait-meta { font-size: 0.78rem; color: var(--ink-soft); }
        .retrait-user { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-soft); word-break: break-all; margin-bottom: 10px; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        .alert {
            padding: 13px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            font-weight: 500;
            font-size: 0.86rem;
            text-align: center;
        }
        .alert-error { background: rgba(255,68,104,0.1); color: var(--danger); border: 1px solid rgba(255,68,104,0.3); }
        .alert-success { background: rgba(22,199,132,0.12); color: var(--success); border: 1px solid rgba(22,199,132,0.3); }

        .loading-gate {
            position: fixed;
            inset: 0;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            color: rgba(255,255,255,0.7);
            font-family: 'Sora', sans-serif;
            font-weight: 600;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="loading-gate" id="loadingGate">Vérification des accès admin...</div>

    <div class="topbar">
        <div class="wordmark"><span class="bolt">P</span>PayOnline</div>
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="admin-badge">Admin</span>
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>
    </div>

    <div class="wrap">
        <div class="alert" id="alertMessage"></div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="users">Utilisateurs</button>
            <button class="tab-btn" data-tab="retraits">Retraits</button>
        </div>

        <!-- ===================== ONGLET UTILISATEURS ===================== -->
        <div class="panel active" id="panel-users">
            <div class="card">
                <h2>Rechercher un utilisateur</h2>
                <div class="subtitle">Par nom ou identifiant (UUID)</div>
                <div class="search-row">
                    <input type="text" id="userSearchInput" placeholder="Nom ou UUID de l'utilisateur">
                    <button class="btn btn-violet" id="userSearchBtn">Chercher</button>
                </div>
            </div>

            <div id="userResults"></div>
        </div>

        <!-- ===================== ONGLET RETRAITS ===================== -->
        <div class="panel" id="panel-retraits">
            <div class="card">
                <h2>Demandes de retrait en attente</h2>
                <div class="subtitle">Validez ou refusez chaque demande</div>
                <button class="btn btn-violet" id="refreshRetraitsBtn" style="width:100%; margin-bottom:4px;">Actualiser</button>
            </div>
            <div id="retraitsList"></div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://chlqzkovnfcyfesyefpl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNobHF6a292bmZjeWZlc3llZnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDM1NDcsImV4cCI6MjEwMjg3OTU0N30.MvFQEHAc5lXzloAb1HXALhy_6abymsXsOeiDoPNJB0w';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_EMAILS_FALLBACK = ['serviceclient08987@gmail.com', 'abdoula13cherif@gmail.com'];

        const loadingGate = document.getElementById('loadingGate');
        const alertMsg = document.getElementById('alertMessage');

        function showAlert(message, type) {
            alertMsg.textContent = message;
            alertMsg.className = `alert alert-${type}`;
            alertMsg.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { alertMsg.style.display = 'none'; }, 4500);
        }

        function fmt(n) {
            const v = Number(n || 0);
            return v.toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' FCFA';
        }

        // ------------------------------------------------------------
        // Garde d'accès admin
        // ------------------------------------------------------------
        async function isAdminUser(user) {
            if (!user) return false;
            try {
                const { data, error } = await _supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();
                if (!error && data) return data.role === 'admin';
            } catch (e) {}
            return ADMIN_EMAILS_FALLBACK.includes((user.email || '').toLowerCase());
        }

        async function guardAdminAccess() {
            const { data: { user }, error } = await _supabase.auth.getUser();
            if (error || !user || !(await isAdminUser(user))) {
                sessionStorage.removeItem('adminAuth');
                window.location.href = 'admin-login.html';
                return;
            }
            sessionStorage.setItem('adminAuth', 'true');
            loadingGate.classList.add('hidden');
        }
        guardAdminAccess();

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await _supabase.auth.signOut();
            sessionStorage.removeItem('adminAuth');
            window.location.href = 'admin-login.html';
        });

        // ------------------------------------------------------------
        // Onglets
        // ------------------------------------------------------------
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'retraits') loadRetraits();
            });
        });

        // ------------------------------------------------------------
        // Onglet Utilisateurs — recherche
        // ------------------------------------------------------------
        const userResults = document.getElementById('userResults');

        document.getElementById('userSearchBtn').addEventListener('click', searchUsers);
        document.getElementById('userSearchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchUsers();
        });

        async function searchUsers() {
            const q = document.getElementById('userSearchInput').value.trim();
            if (!q) { showAlert('Entrez un nom ou un identifiant', 'error'); return; }

            userResults.innerHTML = '<div class="empty-state">Recherche...</div>';

            const { data, error } = await _supabase.rpc('admin_search_users', { search_term: q });

            if (error) {
                userResults.innerHTML = `<div class="empty-state">Erreur : ${error.message}</div>`;
                console.error(error);
                return;
            }
            if (!data || data.length === 0) {
                userResults.innerHTML = '<div class="empty-state">Aucun utilisateur trouvé</div>';
                return;
            }

            userResults.innerHTML = '';
            data.forEach(u => userResults.appendChild(buildUserCard(u)));
        }

        function buildUserCard(u) {
            const card = document.createElement('div');
            card.className = 'card user-card';

            card.innerHTML = `
                <div class="user-head">
                    <div>
                        <div class="user-name">${u.nom || 'Sans nom'}</div>
                        <div class="user-id">${u.id}</div>
                    </div>
                    <span class="role-pill ${u.role === 'admin' ? 'role-admin' : 'role-user'}">${u.role || 'user'}</span>
                </div>

                <div class="stat-row">
                    <div class="stat-box">
                        <div class="label">Solde</div>
                        <div class="value solde-display">${fmt(u.solde)}</div>
                    </div>
                    <div class="stat-box">
                        <div class="label">Cashback</div>
                        <div class="value cashback-display">${fmt(u.cashback)}</div>
                    </div>
                </div>

                <hr class="sep">

                <div class="mini-label">Ajuster le solde (+ / -)</div>
                <div class="search-row">
                    <input type="number" class="delta-input" placeholder="Ex: 5000 ou -2000">
                    <button class="btn btn-primary btn-adjust" style="flex:0 0 auto;">Appliquer</button>
                </div>

                <div class="mini-label" style="margin-top:14px;">Fixer un solde exact</div>
                <div class="search-row">
                    <input type="number" class="setbalance-input" placeholder="Nouveau solde">
                    <button class="btn btn-violet btn-setbalance" style="flex:0 0 auto;">Fixer</button>
                </div>

                <hr class="sep">

                <div class="mini-label">Modifier le profil</div>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" class="nom-input" value="${u.nom || ''}">
                </div>
                <div class="form-group">
                    <label>Cashback</label>
                    <input type="number" class="cashback-input" value="${u.cashback || 0}">
                </div>
                <div class="form-group">
                    <label>Rôle</label>
                    <select class="role-input">
                        <option value="user" ${u.role !== 'admin' ? 'selected' : ''}>user</option>
                        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
                    </select>
                </div>
                <button class="btn btn-primary btn-updateprofile" style="width:100%;">Enregistrer le profil</button>
            `;

            const deltaInput = card.querySelector('.delta-input');
            const setBalanceInput = card.querySelector('.setbalance-input');
            const soldeDisplay = card.querySelector('.solde-display');

            card.querySelector('.btn-adjust').addEventListener('click', async (e) => {
                const delta = parseFloat(deltaInput.value);
                if (isNaN(delta) || delta === 0) { showAlert('Entrez un montant valide', 'error'); return; }
                await runAction(e.target, async () => {
                    const { data, error } = await _supabase.rpc('admin_adjust_balance', {
                        target_user_id: u.id,
                        delta: delta,
                        reason: null
                    });
                    if (error) throw error;
                    soldeDisplay.textContent = fmt(data);
                    deltaInput.value = '';
                    showAlert('Solde ajusté avec succès', 'success');
                });
            });

            card.querySelector('.btn-setbalance').addEventListener('click', async (e) => {
                const val = parseFloat(setBalanceInput.value);
                if (isNaN(val)) { showAlert('Entrez un montant valide', 'error'); return; }
                await runAction(e.target, async () => {
                    const { data, error } = await _supabase.rpc('admin_set_balance', {
                        target_user_id: u.id,
                        new_value: val,
                        reason: null
                    });
                    if (error) throw error;
                    soldeDisplay.textContent = fmt(data);
                    setBalanceInput.value = '';
                    showAlert('Solde fixé avec succès', 'success');
                });
            });

            card.querySelector('.btn-updateprofile').addEventListener('click', async (e) => {
                const newNom = card.querySelector('.nom-input').value.trim();
                const newCashback = parseFloat(card.querySelector('.cashback-input').value);
                const newRole = card.querySelector('.role-input').value;
                await runAction(e.target, async () => {
                    const { error } = await _supabase.rpc('admin_update_profile', {
                        target_user_id: u.id,
                        new_nom: newNom || null,
                        new_cashback: isNaN(newCashback) ? null : newCashback,
                        new_role: newRole
                    });
                    if (error) throw error;
                    card.querySelector('.cashback-display').textContent = fmt(newCashback);
                    card.querySelector('.role-pill').textContent = newRole;
                    card.querySelector('.role-pill').className = `role-pill ${newRole === 'admin' ? 'role-admin' : 'role-user'}`;
                    showAlert('Profil mis à jour', 'success');
                });
            });

            return card;
        }

        // ------------------------------------------------------------
        // Onglet Retraits
        // ------------------------------------------------------------
        const retraitsList = document.getElementById('retraitsList');
        document.getElementById('refreshRetraitsBtn').addEventListener('click', loadRetraits);

        async function loadRetraits() {
            retraitsList.innerHTML = '<div class="empty-state">Chargement...</div>';

            const { data: retraits, error } = await _supabase.rpc('admin_list_pending_retraits');

            if (error) {
                retraitsList.innerHTML = `<div class="empty-state">Erreur : ${error.message}</div>`;
                return;
            }
            if (!retraits || retraits.length === 0) {
                retraitsList.innerHTML = '<div class="empty-state">Aucune demande en attente</div>';
                return;
            }

            retraitsList.innerHTML = '';
            retraits.forEach(r => retraitsList.appendChild(buildRetraitRow(r, r.nom)));
        }

        function buildRetraitRow(r, nom) {
            const row = document.createElement('div');
            row.className = 'card retrait-row';

            row.innerHTML = `
                <div class="retrait-top">
                    <div class="retrait-montant">${fmt(r.montant)}</div>
                    <div class="retrait-meta">${new Date(r.created_at).toLocaleString('fr-FR')}</div>
                </div>
                <div class="retrait-user">${nom ? nom + ' — ' : ''}${r.user_id}</div>
                <div class="form-group">
                    <label>Note (optionnel)</label>
                    <input type="text" class="note-input" placeholder="Motif ou commentaire">
                </div>
                <div class="btn-row">
                    <button class="btn btn-success btn-valider">Valider</button>
                    <button class="btn btn-danger btn-refuser">Refuser</button>
                </div>
            `;

            const noteInput = row.querySelector('.note-input');

            row.querySelector('.btn-valider').addEventListener('click', async (e) => {
                await processRetrait(r.id, 'valide', noteInput.value.trim(), e.target, row);
            });
            row.querySelector('.btn-refuser').addEventListener('click', async (e) => {
                await processRetrait(r.id, 'refuse', noteInput.value.trim(), e.target, row);
            });

            return row;
        }

        async function processRetrait(id, statut, note, btn, row) {
            await runAction(btn, async () => {
                const { error } = await _supabase.rpc('admin_process_retrait', {
                    p_retrait_id: id,
                    new_statut: statut,
                    note: note || null
                });
                if (error) throw error;
                row.remove();
                showAlert(statut === 'valide' ? 'Retrait validé' : 'Retrait refusé', 'success');
                if (!retraitsList.children.length) {
                    retraitsList.innerHTML = '<div class="empty-state">Aucune demande en attente</div>';
                }
            });
        }

        // ------------------------------------------------------------
        // Utilitaire : exécute une action RPC avec état de chargement
        // ------------------------------------------------------------
        async function runAction(btn, fn) {
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '...';
            try {
                await fn();
            } catch (err) {
                console.error(err);
                showAlert(err.message || 'Une erreur est survenue', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    </script>
</body>
</html>
